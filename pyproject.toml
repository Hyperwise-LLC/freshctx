[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshctx"
version = "0.12.0"
description = "Freshness enforcement for AI agent observations and reasoning"
keywords = [
  "ai-agents",
  "agent-reliability",
  "llm",
  "mcp",
  "observability",
  "toctou",
  "validation",
]
authors = [{name = "Hyperwise LLC and FreshCtx contributors"}]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://freshctx.com"
Documentation = "https://github.com/Hyperwise-LLC/freshctx/blob/main/README.md"
Source = "https://github.com/Hyperwise-LLC/freshctx"
"Corporate owner" = "https://hyperwise.io"
Issues = "https://github.com/Hyperwise-LLC/freshctx/issues"
Changelog = "https://github.com/Hyperwise-LLC/freshctx/blob/main/CHANGELOG.md"

[project.scripts]
freshctx = "freshctx.__main__:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
langgraph = ["langgraph>=1,<2"]
agno = ["agno>=2.9,<3"]
openai-agents = ["openai-agents>=0.22,<1"]
google-adk = ["google-adk>=1.26,<2"]
elevenlabs = ["elevenlabs>=2.66,<3"]
mcp-guard = ["mcp>=2,<3"]
conformance = [
  "agno>=2.9,<3",
  "elevenlabs>=2.66,<3",
  "google-adk>=1.26,<2",
  "langgraph>=1,<2",
  "openai-agents>=0.22,<1",
]
test = ["agno>=2.9,<3", "elevenlabs>=2.66,<3", "google-adk>=1.26,<2", "jsonschema>=4.23,<5", "langgraph>=1,<2", "openai-agents>=0.22,<1", "rfc3339-validator>=0.1.4,<1"]
dev = [
  "agno>=2.9,<3",
  "build>=1,<2",
  "elevenlabs>=2.66,<3",
  "google-adk>=1.26,<2",
  "jsonschema>=4.23,<5",
  "langgraph>=1,<2",
  "mypy>=1.11,<2",
  "openai-agents>=0.22,<1",
  "pip-audit>=2.7,<3",
  "rfc3339-validator>=0.1.4,<1",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshctx = ["schemas/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build", "dist"]

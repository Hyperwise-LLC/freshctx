[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshctx"
version = "0.1.0"
description = "Freshness enforcement for AI agent observations and reasoning"
authors = [{name = "FreshCtx contributors"}]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Hyperwise-LLC/freshctx"
Documentation = "https://github.com/Hyperwise-LLC/freshctx/blob/main/README.md"
Repository = "https://github.com/Hyperwise-LLC/freshctx.git"
Issues = "https://github.com/Hyperwise-LLC/freshctx/issues"
Changelog = "https://github.com/Hyperwise-LLC/freshctx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshctx = ["schemas/*.json"]

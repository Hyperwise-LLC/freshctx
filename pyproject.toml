[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshctx"
version = "0.1.1"
description = "Freshness enforcement for AI agent observations and reasoning"
keywords = [
  "ai-agents",
  "agent-reliability",
  "llm",
  "mcp",
  "observability",
  "toctou",
  "validation",
]
authors = [{name = "Hyperwise LLC and FreshCtx contributors"}]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://freshctx.com"
Documentation = "https://github.com/Hyperwise-LLC/freshctx/blob/main/README.md"
Source = "https://github.com/Hyperwise-LLC/freshctx"
"Corporate owner" = "https://hyperwise.io"
Issues = "https://github.com/Hyperwise-LLC/freshctx/issues"
Changelog = "https://github.com/Hyperwise-LLC/freshctx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
langgraph = ["langgraph>=1,<2"]
test = ["jsonschema>=4.23,<5", "langgraph>=1,<2", "rfc3339-validator>=0.1.4,<1"]
dev = ["build>=1,<2", "jsonschema>=4.23,<5", "langgraph>=1,<2", "rfc3339-validator>=0.1.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshctx = ["schemas/*.json"]

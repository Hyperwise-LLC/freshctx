name: Private release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade '.[dev]'
      - name: Release checks
        run: python scripts/release_check.py
      - name: Build
        run: python -m build
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/freshctx-release
          /tmp/freshctx-release/bin/pip install dist/*.whl
          /tmp/freshctx-release/bin/python -m freshctx version
          /tmp/freshctx-release/bin/python -m freshctx demo
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

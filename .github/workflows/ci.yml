name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tooling
        run: python -m pip install -e '.[dev]'
      - name: Static analysis
        run: |
          python -m ruff check src tests scripts examples
          python -m mypy src/freshctx
      - name: Dependency audit
        run: python -m pip_audit .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: README quickstart
        run: python examples/quickstart.py
      - name: Real-world success cases
        run: python examples/real_world_success_cases.py --output success-cases.json
      - name: Feedback-driven scenarios
        run: |
          python examples/payment_balance_change.py
          python examples/stale_booking_approval.py
          python examples/voice_agent_live_record.py
          python examples/manual_preflight_comparison.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify built wheel and installed demo
        run: |
          python -m venv /tmp/freshctx-wheel
          /tmp/freshctx-wheel/bin/pip install --no-deps dist/freshctx-*.whl
          /tmp/freshctx-wheel/bin/python -m freshctx version
          /tmp/freshctx-wheel/bin/python -m freshctx demo
          /tmp/freshctx-wheel/bin/freshctx doctor
      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

  windows-onboarding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell activation and quickstart
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install .
          python examples/quickstart.py
      - name: Command Prompt activation and smoke test
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python -c "import freshctx; print(freshctx.FreshnessStatus.CURRENT.value)"
